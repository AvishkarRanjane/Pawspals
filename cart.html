<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Shopping Cart — PawsPals Pet Shop</title>
  <link rel="stylesheet" href="style3.css" />
</head>
<body>

  <!-- HEADER/NAV -->
  <header>
    <div class="brand">🐾 <strong>PawsPals</strong></div>
    <nav class="nav-links">
      <a href="index.html#home">Home</a>
      <a href="index.html#pets">Pets</a>
      <a href="index.html#shop">Shop</a>
      <a href="index.html#about">About</a>
      <a href="index.html#contact">Contact</a>
    </nav>
  </header>

  <!-- MAIN CART CONTENT -->
  <main>
    <div class="cart-container">
      <h2>🛒 Shopping Cart</h2>
      
      <div class="cart-content">
        <!-- Cart Items -->
        <div class="cart-items">
          <div class="empty-cart">
            <div class="empty-icon">🛍️</div>
            <h3>Your cart is empty</h3>
            <p>Add some pet products to get started!</p>
            <a href="index.html#shop" class="btn">Continue Shopping</a>
          </div>

          <!-- Sample items (will be populated dynamically) -->
          <div class="cart-item-template" style="display: none;">
            <div class="item-image">
              <img src="" alt="product">
            </div>
            <div class="item-details">
              <h4 class="item-name"></h4>
              <p class="item-price"></p>
            </div>
            <div class="item-quantity">
              <button class="qty-btn minus">−</button>
              <input type="number" value="1" min="1">
              <button class="qty-btn plus">+</button>
            </div>
            <div class="item-total"></div>
            <button class="remove-btn">✕</button>
          </div>
        </div>

        <!-- Cart Summary -->
        <div class="cart-summary">
          <div class="summary-card">
            <h3>Order Summary</h3>
            
            <div class="summary-row">
              <span>Subtotal</span>
              <span class="subtotal">₹0</span>
            </div>

            <div class="summary-row">
              <span>Shipping</span>
              <span class="shipping">₹0</span>
            </div>

            <div class="summary-row">
              <span>Tax</span>
              <span class="tax">₹0</span>
            </div>

            <div class="summary-divider"></div>

            <div class="summary-row total">
              <span>Total</span>
              <span class="total-amount">₹0</span>
            </div>

            <input type="submit" class="checkout-btn" value="Proceed to Checkout">
            <a href="index.html#shop" class="continue-shopping">Continue Shopping</a>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- FOOTER -->
  <footer>
    <div>© 2025 PawsPals. All rights reserved. | <a href="index.html">Back to Shop</a></div>
  </footer>

  <script src="main.js"></script>
</body>
</html>
