<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Login — PawsPals Pet Shop</title>
  <link rel="stylesheet" href="style2.css" />
</head>
<body>

  <!-- HEADER/NAV -->
  <header>
    <div class="brand">🐾 <strong>PawsPals</strong></div>
    <nav class="nav-links">
      <a href="index.html#home">Home</a>
      <a href="index.html#pets">Pets</a>
      <a href="index.html#shop">Shop</a>
      <a href="index.html#about">About</a>
      <a href="index.html#contact">Contact</a>
    </nav>
  </header>

  <!-- MAIN LOGIN CONTENT -->
  <main>
    <div class="form-container">
      <h2>🐾 Welcome Back</h2>
      <p class="subtitle">Login to your PawsPals account</p>
      
      <form class="login-form">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" placeholder="your@email.com" required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Enter your password" required>
        </div>

        <div class="remember-forgot">
          <div class="checkbox-option">
            <input type="checkbox" id="remember" name="remember" value="yes">
            <label for="remember">Remember me</label>
          </div>
          <a href="#forgot">Forgot password?</a>
        </div>

        <input type="submit" value="Login">
      </form>

      <div class="signup-link">
        <p>Don't have an account? <a href="Form.html">Register here</a></p>
      </div>
    </div>
  </main>

  <!-- FOOTER -->
  <footer>
    <div>© 2025 PawsPals. All rights reserved. | <a href="index.html">Back to Shop</a></div>
  </footer>

  <script src="main.js"></script>
</body>
</html>
